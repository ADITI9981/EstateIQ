
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: estateiq-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: estateiq-frontend
    ports:
      - "8502:8501"
    environment:
      ESTATEIQ_API_URL: http://backend:8000/chat
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  huggingface_cache:
